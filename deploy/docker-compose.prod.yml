# TOMOH Weekly Report Automation — Production-Hardened Internal Docker Compose
# IMPORTANT: Deploy ONLY on an approved private internal VLAN behind corporate SSO & TLS.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tomoh_reports}
      POSTGRES_USER: ${POSTGRES_USER:-tomoh_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tomoh_pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tomoh_app} -d ${POSTGRES_DB:-tomoh_reports}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tomoh_internal

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=256M
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tomoh_uploads:/var/lib/tomoh/uploads
      - tomoh_generated:/var/lib/tomoh/generated
      - ./templates:/var/lib/tomoh/templates:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tomoh_internal

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - app
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tomoh_internal

volumes:
  tomoh_pgdata:
  tomoh_uploads:
  tomoh_generated:

networks:
  tomoh_internal:
    driver: bridge
